<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>منظومة السيرة والمواظبة V2</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body{margin:0;font-family:Tahoma,Arial;background:#f8fafc;color:#0f172a}
    #m{padding:28px;text-align:center;font-weight:bold;line-height:1.9}
    iframe{border:0;width:100vw;height:100vh;display:block;background:#fff}
  </style>
</head>
<body>
  <div id="m">جاري فتح منظومة السيرة والمواظبة...</div>

  <script>
    const EMPTY_IMPORT_STAMP = 'SIRA_V2_WEB_EMPTY_IMPORT_20260613_02';

    function injectEmptyStartupGuard(html){
      const guard = `
<script>
(function(){
  var stamp='${EMPTY_IMPORT_STAMP}';
  var stampKey='__sira_v2_web_empty_import_stamp__';
  function emptyStartup(){
    try{
      if(localStorage.getItem(stampKey)!==stamp){
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem(stampKey, stamp);
        localStorage.setItem('personalClasses', '{}');
        localStorage.setItem('importedPersonalClasses', '{}');
        localStorage.setItem('studentInfoRecords', '[]');
        localStorage.setItem('importedStudentInfoRecords', '[]');
      }
    }catch(e){}
  }
  function hideDefaultTrialLists(){
    try{
      var forbidden=/8\\s*أساسي\\s*(6|7|8|9)|الصف\\s*العاشر|تجريبي|افتراضي/i;
      document.querySelectorAll('option').forEach(function(opt){var text=(opt.textContent||'')+' '+(opt.value||'');if(forbidden.test(text)) opt.remove();});
      document.querySelectorAll('[data-class], .class-card, .student-row, .student-item').forEach(function(el){var text=el.textContent||'';if(forbidden.test(text)) el.remove();});
    }catch(e){}
  }
  function restoreStudentInfoDefaults(){
    var birthPlaceKeys=['مكان الولادة','مكانها','مكان الازدياد','مكان الميلاد','placeOfBirth','birthPlace','birthplace','birth_location','birthLocation','lieuNaissance','lieu_naissance','place_naissance'];
    var fatherKeys=['اسم الأب','اسم الاب','إسم الأب','إسم الاب','الأب','الاب','الأب أو الولي','اسم الأب أو الولي','fatherName','father','father_name','pere','nomPere','nom_pere'];
    var guardianKeys=['الولي','اسم الولي','ولي','ولي الأمر','اسم ولي الأمر','الأب أو الولي','اسم الأب أو الولي','guardian','guardianName','guardian_name','wali','parent','parentName','parent_name','tuteur','responsable'];
    function getVal(o,keys){for(var i=0;i<keys.length;i++){if(Object.prototype.hasOwnProperty.call(o,keys[i])&&String(o[keys[i]]||'').trim())return String(o[keys[i]]).trim();}return '';}
    function setAllDefaults(o,keys,value){for(var i=0;i<keys.length;i++){if(!String(o[keys[i]]||'').trim())o[keys[i]]=value;}}
    function normalizeRecord(o){if(!o||typeof o!=='object'||Array.isArray(o))return;if(!getVal(o,birthPlaceKeys))setAllDefaults(o,birthPlaceKeys,'تونس');var father=getVal(o,fatherKeys);if(father)setAllDefaults(o,guardianKeys,father);}
    function walk(v,depth){if(depth>8||!v)return v;if(Array.isArray(v)){v.forEach(function(x){walk(x,depth+1);});return v;}if(typeof v==='object'){normalizeRecord(v);Object.keys(v).forEach(function(k){if(v[k]&&typeof v[k]==='object')walk(v[k],depth+1);});}return v;}
    function normalizeJsonString(text){try{var obj=JSON.parse(text);walk(obj,0);return JSON.stringify(obj);}catch(e){return text;}}
    try{
      var keys=['studentInfoRecords','importedStudentInfoRecords','personalStudentInfoRecords','studentsInfo','studentInfos'];
      keys.forEach(function(k){var v=localStorage.getItem(k);if(v)localStorage.setItem(k,normalizeJsonString(v));});
      if(!Storage.prototype.__siraV2InfoNormalizer){
        var originalSetItem=Storage.prototype.setItem;
        Storage.prototype.setItem=function(k,v){try{if(/student.*info|info.*student|records/i.test(String(k)))v=normalizeJsonString(v);}catch(e){}return originalSetItem.call(this,k,v);};
        Storage.prototype.__siraV2InfoNormalizer=true;
      }
    }catch(e){}
  }
  emptyStartup();
  restoreStudentInfoDefaults();
  window.__siraV2NormalizeStudentInfoNow=restoreStudentInfoDefaults;
  window.__SIRA_V2_EMPTY_IMPORT_ONLY__=true;
  window.addEventListener('DOMContentLoaded',function(){hideDefaultTrialLists();restoreStudentInfoDefaults();});
  window.addEventListener('load',function(){setTimeout(hideDefaultTrialLists,300);setTimeout(hideDefaultTrialLists,1200);setTimeout(hideDefaultTrialLists,2500);setTimeout(restoreStudentInfoDefaults,300);setTimeout(restoreStudentInfoDefaults,1200);setTimeout(restoreStudentInfoDefaults,2500);});
})();
<\/script>`;
      if(html.includes(EMPTY_IMPORT_STAMP) && html.includes('setAllDefaults')) return html;
      if(/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function(match){ return match + guard; });
      return guard + html;
    }

    function patchHtmlSource(html){
      html = html.replace(/<option\s+value="9">\s*8\s*أساسي\s*9\s*<\/option>\s*<option\s+value="8">\s*8\s*أساسي\s*8\s*<\/option>\s*<option\s+value="7">\s*8\s*أساسي\s*7\s*<\/option>\s*<option\s+value="6">\s*8\s*أساسي\s*6\s*<\/option>/gi,'');
      html = html.replace('const ORIGINAL_DEFAULT_CLASSES = JSON.parse(JSON.stringify(data));','const ORIGINAL_DEFAULT_CLASSES = {};\nObject.keys(data).forEach(k => delete data[k]);');
      html = html.replace(/savePersonalClasses\(saved\);/,"savePersonalClasses(saved);\n    try{ localStorage.setItem('importedPersonalClasses', JSON.stringify(saved)); localStorage.setItem('personalClasses', JSON.stringify(saved)); }catch(e){}");
      html = html.replace(/saveImportedStudentInfoRecords\(\);/,"saveImportedStudentInfoRecords();\n    if(window.__siraV2NormalizeStudentInfoNow) window.__siraV2NormalizeStudentInfoNow();");
      html = html.replace('setTimeout(autoRestoreWhenEmpty, 1400);','// Auto restore disabled in Firebase empty-import web build\n    // setTimeout(autoRestoreWhenEmpty, 1400);');
      return injectEmptyStartupGuard(html);
    }

    async function fetchLatestZipPath(){
      const api='https://api.github.com/repos/princejour/sira-v2/git/trees/main?recursive=1';
      const res=await fetch(api);
      if(!res.ok) throw new Error('تعذر الاتصال بمستودع sira-v2');
      const json=await res.json();
      const zips=(json.tree||[]).filter(x=>/\.zip$/i.test(x.path)&&!/extracted|build|gradle/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));
      if(!zips.length) throw new Error('لا يوجد ملف ZIP في مستودع sira-v2');
      return zips[zips.length-1].path;
    }
    async function run(){
      try{
        const zipPath=await fetchLatestZipPath();
        const zipUrl='https://raw.githubusercontent.com/princejour/sira-v2/main/'+zipPath.split('/').map(encodeURIComponent).join('/');
        const zipBytes=await (await fetch(zipUrl)).arrayBuffer();
        const zip=await JSZip.loadAsync(zipBytes);
        const indexPath=Object.keys(zip.files).find(p=>/app\/src\/main\/assets\/index\.html$/i.test(p))||Object.keys(zip.files).find(p=>/(^|\/)index\.html$/i.test(p));
        if(!indexPath) throw new Error('لم يتم العثور على index.html داخل ZIP');
        let html=await zip.files[indexPath].async('string');
        html=patchHtmlSource(html);
        const frame=document.createElement('iframe');
        document.body.innerHTML='';
        document.body.appendChild(frame);
        frame.srcdoc=html;
      }catch(e){document.getElementById('m').innerHTML='خطأ في فتح نسخة Firebase:<br>'+String(e.message||e);}
    }
    run();
  </script>
</body>
</html>
