name: Construire APK Sira2 Empty Import

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depot - Checkout
        uses: actions/checkout@v4

      - name: Preparer le projet
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE"
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP trouve: $ZIP_FILE"
            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
            SEARCH_ROOT="$GITHUB_WORKSPACE/extracted"
          else
            echo "Aucun ZIP trouve, recherche directe dans le depot."
          fi

          echo "Recherche de settings.gradle..."
          PROJECT_FILE="$(find "$SEARCH_ROOT" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1 || true)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR: settings.gradle introuvable."
            echo "Contenu trouve:"
            find "$SEARCH_ROOT" -maxdepth 5 -type f | sed -n '1,160p'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Gradle trouve dans: $PROJECT_DIR"

      - name: Appliquer le correctif demarrage vide
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/empty_import_patch.py"

      - name: Installation JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configuration Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generer un APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Televerser le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: sira2-empty-import-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
