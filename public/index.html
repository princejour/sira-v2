<title>منظومة السيرة والمواظبة V2</title>

<style>body{margin:0;font-family:Tahoma,Arial;background:#f8fafc;color:#0f172a}#m{padding:28px;text-align:center;font-weight:bold;line-height:1.9}iframe{border:0;width:100vw;height:100vh;display:block;background:#fff}</style>
</head>
<body>
<div id="m">جاري فتح منظومة السيرة والمواظبة...</div>
<script>
const STAMP='SIRA_V2_WEB_FIREBASE_ALL_SYNC_20260613_01';
function injectedGuard(){return `
<script>
(function(){
var mark='SIRA_V2_WEB_FIREBASE_ALL_SYNC_20260613_01';
function n(s){return String(s||'').replace(/[\\u064B-\\u065F\\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\\s+/g,'').toLowerCase();}
function ix(h,a){var hh=h.map(n);for(var j=0;j<a.length;j++){var x=n(a[j]);for(var i=0;i<hh.length;i++){if(hh[i]===x||hh[i].indexOf(x)>=0||x.indexOf(hh[i])>=0)return i;}}return -1;}
function c(r,i){return i>=0?String(r[i]||'').trim():'';}
function toast(m,t){try{if(typeof showToast==='function')showToast(m,t||'success');else alert(m);}catch(e){}}
function rec(cls,name,id,bd,bp,fa){bp=(bp||'').trim()||'تونس';fa=(fa||'').trim();return {'القسم':cls,'className':cls,'class':cls,'اسم التلميذ':name,'الاسم واللقب':name,'name':name,'studentName':name,'المعرف الوحيد':id,'معرف وحيد':id,'uniqueId':id,'studentId':id,'identifiantUnique':id,'تاريخ الولادة':bd,'birthDate':bd,'dateNaissance':bd,'مكان الولادة':bp,'مكانها':bp,'مكان الميلاد':bp,'مكان الازدياد':bp,'birthPlace':bp,'placeOfBirth':bp,'lieuNaissance':bp,'اسم الأب':fa,'اسم الاب':fa,'الأب':fa,'الاب':fa,'fatherName':fa,'father':fa,'nomPere':fa,'الولي':fa,'اسم الولي':fa,'ولي الأمر':fa,'اسم ولي الأمر':fa,'guardianName':fa,'guardian':fa,'parentName':fa,'tuteur':fa};}
function parse(aoa){if(!aoa||!aoa.length)return null;var h=(aoa[0]||[]).map(function(x){return String(x||'').trim();});var ic=ix(h,['القسم','قسم','class','classe']);var iname=ix(h,['اسم التلميذ','الاسم واللقب','الإسم واللقب','اسم ولقب','الاسم','name','studentName']);if(ic<0||iname<0)return null;var iid=ix(h,['المعرف الوحيد','معرف وحيد','uniqueId','identifiant unique','id unique']);var ibd=ix(h,['تاريخ الولادة','تاريخ الميلاد','date naissance','birthDate']);var ibp=ix(h,['مكان الولادة','مكان الميلاد','مكان الازدياد','مكانها','lieu naissance','birthPlace','placeOfBirth']);var ifa=ix(h,['اسم الأب','اسم الاب','الأب','الاب','fatherName','nom pere','pere']);var p={},rs=[];for(var r=1;r<aoa.length;r++){var row=aoa[r]||[],cls=c(row,ic),name=c(row,iname);if(!cls||!name)continue;if(!p[cls])p[cls]=[];if(p[cls].indexOf(name)<0)p[cls].push(name);rs.push(rec(cls,name,c(row,iid),c(row,ibd),c(row,ibp),c(row,ifa)));}return Object.keys(p).length?{p:p,rs:rs}:null;}
function refresh(p){try{if(typeof replaceDataWithPersonalClasses==='function')replaceDataWithPersonalClasses();}catch(e){}try{if(typeof refreshClassSelectOptions==='function')refreshClassSelectOptions(Object.keys(p||{})[0]||'');}catch(e){}try{if(typeof resetDashboard==='function')resetDashboard();}catch(e){}try{if(typeof renderStudentsList==='function')renderStudentsList();}catch(e){}try{if(typeof renderPersonalClassesList==='function')renderPersonalClassesList();}catch(e){}try{if(typeof clearImportedClassesFile==='function')clearImportedClassesFile();}catch(e){}}
function setStores(p,rs){p=p||{};rs=rs||[];try{if(typeof savePersonalClasses==='function')savePersonalClasses(p);}catch(e){}try{localStorage.setItem('personalClasses',JSON.stringify(p));localStorage.setItem('importedPersonalClasses',JSON.stringify(p));}catch(e){}var by={};rs.forEach(function(r){var nm=r['الاسم واللقب']||r.name||r.studentName,cl=r['القسم']||r.className||r.class;if(nm){by[nm]=r;if(cl)by[cl+'|'+nm]=r;}});['studentInfoRecords','importedStudentInfoRecords','personalStudentInfoRecords','studentsInfo','studentInfos'].forEach(function(k){try{localStorage.setItem(k,JSON.stringify(rs));}catch(e){}});['studentInfoByName','studentInfosByName','studentCards','studentCardsByName','siraStudentInfo'].forEach(function(k){try{localStorage.setItem(k,JSON.stringify(by));}catch(e){}});refresh(p);}
function rich(){var input=document.querySelector('input[type=file]'),f=input&&input.files&&input.files[0];if(!f||!window.XLSX)return false;var reader=new FileReader();reader.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}),o=parse(aoa);if(o){setStores(o.p,o.rs);toast('تم استيراد الأقسام ومعطيات بطاقة السيرة بنجاح','success');}else if(window.__oldImport)window.__oldImport();}catch(e){if(window.__oldImport)window.__oldImport();}};reader.readAsArrayBuffer(f);return true;}
function j(k,d){try{return JSON.parse(localStorage.getItem(k)||d);}catch(e){return JSON.parse(d);}}
function ne(o){return o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length>0;}
function payload(){var p=j('personalClasses','{}'),ip=j('importedPersonalClasses','{}');if(!ne(p)&&ne(ip))p=ip;if(ne(p)){try{localStorage.setItem('personalClasses',JSON.stringify(p));localStorage.setItem('importedPersonalClasses',JSON.stringify(p));}catch(e){}}var keys=['studentInfoRecords','importedStudentInfoRecords','personalStudentInfoRecords','studentsInfo','studentInfos'],rs=[];for(var i=0;i<keys.length;i++){var x=j(keys[i],'[]');if(Array.isArray(x)&&x.length>rs.length)rs=x;}return {personalClasses:p,importedPersonalClasses:p,studentInfoRecords:rs,importedStudentInfoRecords:rs,updatedAt:new Date().toISOString(),source:'sira-v2-all-classes'};}
function fb(){return window.firebase||null;}
async function up(){var f=fb();if(!f)throw new Error('Firebase غير جاهز');var d=payload(),ok=false;if(f.firestore){try{await f.firestore().collection('sira2_sync').doc('all_classes').set(d,{merge:true});ok=true;}catch(e){}}if(f.database){try{await f.database().ref('sira2_sync/all_classes').set(d);ok=true;}catch(e){}}if(!ok)throw new Error('تعذر الرفع إلى Firebase');toast('تم رفع كل الأقسام ومعطيات بطاقة السيرة إلى Firebase','success');}
async function down(){var f=fb();if(!f)throw new Error('Firebase غير جاهز');var d=null;if(f.firestore){try{var s=await f.firestore().collection('sira2_sync').doc('all_classes').get();if(s&&s.exists)d=s.data();}catch(e){}}if(!d&&f.database){try{var v=await f.database().ref('sira2_sync/all_classes').once('value');d=v.val();}catch(e){}}if(!d)throw new Error('لا توجد نسخة كاملة محفوظة في Firebase');setStores(d.personalClasses||d.importedPersonalClasses||{},d.studentInfoRecords||d.importedStudentInfoRecords||[]);toast('تم استرجاع كل الأقسام ومعطيات بطاقة السيرة من Firebase','success');}
function install(){if(window.__richAndFirebaseOn)return;window.__richAndFirebaseOn=true;window.__oldImport=window.importPersonalClassesFile;window.importPersonalClassesFile=function(){if(rich())return;if(window.__oldImport)return window.__oldImport.apply(this,arguments);};try{importPersonalClassesFile=window.importPersonalClassesFile;}catch(e){}document.addEventListener('click',function(ev){var t=(ev.target&&ev.target.textContent)||'';if(/رفع.*(Firebase|فاير)|(?:Firebase|فاير).*رفع/i.test(t)){ev.preventDefault();ev.stopPropagation();up().catch(function(e){toast(String(e.message||e),'error');});return;}if(/(استرجاع|استيراد).*(Firebase|فاير)|(?:Firebase|فاير).*(استرجاع|استيراد)/i.test(t)){ev.preventDefault();ev.stopPropagation();down().catch(function(e){toast(String(e.message||e),'error');});return;}if(/استيراد وحفظ|استيراد/.test(t)&&!/(Firebase|فاير)/i.test(t)){if(rich()){ev.preventDefault();ev.stopPropagation();}}},true);}
install();setTimeout(install,500);setTimeout(install,1500);setTimeout(install,3000);
})();
<\/script>`;}
function patchHtmlSource(html){if(!html.includes(STAMP)){html=html.replace(/<head[^>]*>/i,function(m){return m+injectedGuard();});}html=html.replace(/<option\s+value="9">\s*8\s*أساسي\s*9\s*<\/option>\s*<option\s+value="8">\s*8\s*أساسي\s*8\s*<\/option>\s*<option\s+value="7">\s*8\s*أساسي\s*7\s*<\/option>\s*<option\s+value="6">\s*8\s*أساسي\s*6\s*<\/option>/gi,'');html=html.replace('const ORIGINAL_DEFAULT_CLASSES = JSON.parse(JSON.stringify(data));','const ORIGINAL_DEFAULT_CLASSES = {};\nObject.keys(data).forEach(k => delete data[k]);');html=html.replace('setTimeout(autoRestoreWhenEmpty, 1400);','// Auto restore disabled\n    // setTimeout(autoRestoreWhenEmpty, 1400);');return html;}
async function fetchLatestZipPath(){const api='https://api.github.com/repos/princejour/sira-v2/git/trees/main?recursive=1';const res=await fetch(api);if(!res.ok)throw new Error('تعذر الاتصال بمستودع sira-v2');const json=await res.json();const zips=(json.tree||[]).filter(x=>/\.zip$/i.test(x.path)&&!/extracted|build|gradle/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));if(!zips.length)throw new Error('لا يوجد ملف ZIP في مستودع sira-v2');return zips[zips.length-1].path;}
async function run(){try{const zipPath=await fetchLatestZipPath();const zipUrl='https://raw.githubusercontent.com/princejour/sira-v2/main/'+zipPath.split('/').map(encodeURIComponent).join('/');const zipBytes=await(await fetch(zipUrl)).arrayBuffer();const zip=await JSZip.loadAsync(zipBytes);const indexPath=Object.keys(zip.files).find(p=>/app\/src\/main\/assets\/index\.html$/i.test(p))||Object.keys(zip.files).find(p=>/(^|\/)index\.html$/i.test(p));if(!indexPath)throw new Error('لم يتم العثور على index.html داخل ZIP');let html=await zip.files[indexPath].async('string');html=patchHtmlSource(html);const frame=document.createElement('iframe');document.body.innerHTML='';document.body.appendChild(frame);frame.srcdoc=html;}catch(e){document.getElementById('m').innerHTML='خطأ في فتح نسخة Firebase:<br>'+String(e.message||e);}}
run();
</script>
