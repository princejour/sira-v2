name: Construire APK Sira2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dépôt - Checkout
        uses: actions/checkout@v4

      - name: Préparer le projet
        run: |
          set -e
          mkdir -p work

          # إذا رفعت ZIP داخل المستودع، يفك الضغط
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP trouvé: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d work
          else
            echo "Aucun ZIP trouvé, utilisation du dépôt tel quel"
            cp -R . work/repo
          fi

          echo "Recherche de settings.gradle..."
          PROJECT_DIR="$(find work -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1 | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR: settings.gradle introuvable. Le projet Android n'est pas à la racine ou le ZIP n'est pas correct."
            find work -maxdepth 4 -type f | sed -n '1,120p'
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Gradle trouvé dans: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Installation JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configuration Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Générer un APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Téléverser le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: sira2-model2-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
