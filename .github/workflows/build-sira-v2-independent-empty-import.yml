name: Build Sira V2 Independent Empty Import APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then echo "No ZIP file found"; exit 1; fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: $ZIP_FILE"

      - name: Unzip project
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted
          find extracted -maxdepth 4 -type f | head -n 120

      - name: Find Android project folder
        id: find_project
        run: |
          set -e
          PROJECT_FILE="$(find extracted -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then echo "No Android project found"; exit 1; fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Force independent package and remove default classes at source
        run: |
          set -e
          cd "${{ steps.find_project.outputs.project_dir }}"
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_id = 'com.walhero.sira.v2.emptyimport.clean'
          label = 'السيرة والمواظبة - استيراد فقط'
          # Android identity: separate app, not update
          for gf in list(Path('.').rglob('build.gradle')) + list(Path('.').rglob('build.gradle.kts')):
              s = gf.read_text(encoding='utf-8')
              original = s
              s = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{app_id}"', s)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{app_id}"', s)
              s = re.sub(r"applicationId\s+'[^']+'", f"applicationId '{app_id}'", s)
              s = re.sub(r'namespace\s+"[^"]+"', f'namespace "{app_id}"', s)
              s = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{app_id}"', s)
              s = re.sub(r"namespace\s+'[^']+'", f"namespace '{app_id}'", s)
              if gf.name in ('build.gradle','build.gradle.kts') and gf.parent.name == 'app':
                  if 'applicationId' not in s and 'defaultConfig {' in s:
                      s = s.replace('defaultConfig {', 'defaultConfig {\n        applicationId "'+app_id+'"', 1)
                  if 'namespace' not in s and 'android {' in s:
                      s = s.replace('android {', 'android {\n    namespace "'+app_id+'"', 1)
                  s = re.sub(r'versionCode\s+\d+', 'versionCode 201', s)
                  s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 201', s)
                  s = re.sub(r'versionName\s+"[^"]+"', 'versionName "empty-import-2.0"', s)
                  s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "empty-import-2.0"', s)
                  s = re.sub(r"versionName\s+'[^']+'", "versionName 'empty-import-2.0'", s)
              if s != original:
                  gf.write_text(s, encoding='utf-8')
                  print('Updated', gf)
          for mf in Path('.').rglob('AndroidManifest.xml'):
              s = mf.read_text(encoding='utf-8')
              s = re.sub(r'package="[^"]+"', f'package="{app_id}"', s)
              s = re.sub(r'android:label="[^"]+"', f'android:label="{label}"', s, count=1)
              mf.write_text(s, encoding='utf-8')
          for sp in Path('.').rglob('strings.xml'):
              s = sp.read_text(encoding='utf-8')
              s = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{label}</string>', s)
              sp.write_text(s, encoding='utf-8')
          # HTML source correction: no default classes, imports replace not merge
          patched = 0
          for html in Path('.').rglob('*.html'):
              s = html.read_text(encoding='utf-8')
              if 'ORIGINAL_DEFAULT_CLASSES' not in s or 'function saveImportedPersonalClasses' not in s:
                  continue
              s = re.sub(r'<option value="9">8 أساسي 9</option><option value="8">8 أساسي 8</option><option value="7">8 أساسي 7</option><option value="6">8 أساسي 6</option>', '', s)
              s = s.replace('const ORIGINAL_DEFAULT_CLASSES = JSON.parse(JSON.stringify(data));', 'const ORIGINAL_DEFAULT_CLASSES = {};\nObject.keys(data).forEach(k => delete data[k]);')
              s = re.sub(r'function replaceDataWithPersonalClasses\(\)\{.*?\n\}\nfunction getClassLabel', '''function replaceDataWithPersonalClasses(){
    const personal = getPersonalClasses();
    Object.keys(data).forEach(k => delete data[k]);
    Object.keys(personal || {}).forEach(k => {
        if(!Array.isArray(personal[k]) || personal[k].length === 0) return;
        const classKey = normalizeClassNameForStorage(k);
        if(!data[classKey]) data[classKey] = [];
        personal[k].forEach(studentName => {
            if(studentName && !data[classKey].includes(studentName)) data[classKey].push(studentName);
        });
    });
    applyStudentRenamesToData();
}
function getClassLabel''', s, flags=re.S)
              s = re.sub(r'function saveImportedPersonalClasses\(personal\)\{.*?\n\}\nfunction importPersonalClassesFile', '''function saveImportedPersonalClasses(personal){
    const keys = Object.keys(personal || {});
    if(keys.length === 0){
        showToast('لم يتم العثور على أقسام وتلاميذ داخل الملف. تأكد من وجود عمود: القسم وعمود: اسم التلميذ','info');
        return;
    }
    const saved = {};
    keys.forEach(className => {
        if(!Array.isArray(personal[className])) return;
        const classKey = normalizeClassNameForStorage(className);
        if(!saved[classKey]) saved[classKey] = [];
        personal[className].forEach(studentName => {
            if(studentName && !saved[classKey].includes(studentName)) saved[classKey].push(studentName);
        });
    });
    savePersonalClasses(saved);
    saveImportedStudentInfoRecords();
    replaceDataWithPersonalClasses();
    refreshClassSelectOptions(Object.keys(saved)[0] || '');
    resetDashboard();
    renderStudentsList();
    renderPersonalClassesList();
    clearImportedClassesFile();
    showToast('تم استبدال كل الأقسام القديمة بالأقسام المستوردة فقط','success');
}
function importPersonalClassesFile''', s, flags=re.S)
              s = s.replace('setTimeout(autoRestoreWhenEmpty, 1400);', '// Auto restore disabled in empty-import build\n    // setTimeout(autoRestoreWhenEmpty, 1400);')
              if 'EMPTY_IMPORT_NO_DEFAULT_CLASSES_FIXED_V2' not in s:
                  s = s.replace('</head>', '<!-- EMPTY_IMPORT_NO_DEFAULT_CLASSES_FIXED_V2 --></head>') if '</head>' in s else '<!-- EMPTY_IMPORT_NO_DEFAULT_CLASSES_FIXED_V2 -->\n' + s
              html.write_text(s, encoding='utf-8')
              patched += 1
              print('Patched HTML at source:', html)
          if patched == 0:
              raise SystemExit('No app HTML was patched; default classes remain')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: |
          set -e
          cd "${{ steps.find_project.outputs.project_dir }}"
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Verify independent APK package
        run: |
          set -e
          cd "${{ steps.find_project.outputs.project_dir }}"
          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          BADGING="$($AAPT dump badging "$APK_FILE")"
          echo "$BADGING" | head -n 5
          echo "$BADGING" | grep "package: name='com.walhero.sira.v2.emptyimport.clean'" || { echo "ERROR: wrong package"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sira-v2-empty-import-no-defaults-apk
          path: ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
