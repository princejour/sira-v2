<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>منظومة السيرة والمواظبة V2</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>body{margin:0;font-family:Tahoma,Arial;background:#f8fafc;color:#0f172a}#m{padding:28px;text-align:center;font-weight:bold;line-height:1.9}iframe{border:0;width:100vw;height:100vh;display:block;background:#fff}</style>
</head>
<body>
  <div id="m">جاري فتح منظومة السيرة والمواظبة...</div>
  <script>
    const STAMP='SIRA_V2_WEB_RICH_IMPORT_20260613_01';
    function injectedGuard(){return `
<script>
(function(){
var mark='SIRA_V2_WEB_RICH_IMPORT_20260613_01';
function n(s){return String(s||'').replace(/[\\u064B-\\u065F\\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\\s+/g,'').toLowerCase();}
function ix(h,a){var hh=h.map(n);for(var j=0;j<a.length;j++){var x=n(a[j]);for(var i=0;i<hh.length;i++){if(hh[i]===x||hh[i].indexOf(x)>=0||x.indexOf(hh[i])>=0)return i;}}return -1;}
function c(r,i){return i>=0?String(r[i]||'').trim():'';}
function rec(cls,name,id,bd,bp,fa){bp=(bp||'').trim()||'تونس';fa=(fa||'').trim();return {'القسم':cls,'className':cls,'اسم التلميذ':name,'الاسم واللقب':name,'name':name,'studentName':name,'المعرف الوحيد':id,'uniqueId':id,'studentId':id,'تاريخ الولادة':bd,'birthDate':bd,'مكان الولادة':bp,'مكانها':bp,'مكان الميلاد':bp,'مكان الازدياد':bp,'birthPlace':bp,'placeOfBirth':bp,'اسم الأب':fa,'اسم الاب':fa,'الأب':fa,'الاب':fa,'fatherName':fa,'father':fa,'الولي':fa,'اسم الولي':fa,'ولي الأمر':fa,'guardianName':fa,'guardian':fa,'parentName':fa};}
function parse(aoa){if(!aoa||!aoa.length)return null;var h=(aoa[0]||[]).map(function(x){return String(x||'').trim();});var ic=ix(h,['القسم','قسم','class','classe']);var iname=ix(h,['اسم التلميذ','الاسم واللقب','الإسم واللقب','اسم ولقب','name','studentName']);if(ic<0||iname<0)return null;var iid=ix(h,['المعرف الوحيد','معرف وحيد','uniqueId','identifiant unique']);var ibd=ix(h,['تاريخ الولادة','تاريخ الميلاد','birthDate','date naissance']);var ibp=ix(h,['مكان الولادة','مكان الميلاد','مكان الازدياد','مكانها','birthPlace','placeOfBirth','lieu naissance']);var ifa=ix(h,['اسم الأب','اسم الاب','الأب','الاب','fatherName','nom pere']);var p={},rs=[];for(var r=1;r<aoa.length;r++){var row=aoa[r]||[],cls=c(row,ic),name=c(row,iname);if(!cls||!name)continue;if(!p[cls])p[cls]=[];if(p[cls].indexOf(name)<0)p[cls].push(name);rs.push(rec(cls,name,c(row,iid),c(row,ibd),c(row,ibp),c(row,ifa)));}return Object.keys(p).length?{p:p,rs:rs}:null;}
function save(o){var p=o.p,rs=o.rs;try{if(typeof savePersonalClasses==='function')savePersonalClasses(p);}catch(e){}try{localStorage.setItem('personalClasses',JSON.stringify(p));localStorage.setItem('importedPersonalClasses',JSON.stringify(p));}catch(e){}var by={};rs.forEach(function(r){by[r['الاسم واللقب']]=r;by[r['القسم']+'|'+r['الاسم واللقب']]=r;});['studentInfoRecords','importedStudentInfoRecords','personalStudentInfoRecords','studentsInfo','studentInfos'].forEach(function(k){try{localStorage.setItem(k,JSON.stringify(rs));}catch(e){}});['studentInfoByName','studentInfosByName','studentCards','studentCardsByName','siraStudentInfo'].forEach(function(k){try{localStorage.setItem(k,JSON.stringify(by));}catch(e){}});try{if(typeof replaceDataWithPersonalClasses==='function')replaceDataWithPersonalClasses();}catch(e){}try{if(typeof refreshClassSelectOptions==='function')refreshClassSelectOptions(Object.keys(p)[0]||'');}catch(e){}try{if(typeof renderStudentsList==='function')renderStudentsList();}catch(e){}try{if(typeof renderPersonalClassesList==='function')renderPersonalClassesList();}catch(e){}try{if(typeof clearImportedClassesFile==='function')clearImportedClassesFile();}catch(e){}try{if(typeof showToast==='function')showToast('تم استيراد الأقسام ومعطيات بطاقة السيرة بنجاح','success');}catch(e){alert('تم استيراد الأقسام ومعطيات بطاقة السيرة بنجاح');}}
function rich(){var input=document.querySelector('input[type=file]'),f=input&&input.files&&input.files[0];if(!f||!window.XLSX)return false;var reader=new FileReader();reader.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}),o=parse(aoa);if(o)save(o);else if(window.__oldImport)window.__oldImport();}catch(e){if(window.__oldImport)window.__oldImport();}};reader.readAsArrayBuffer(f);return true;}
function install(){if(window.__richImportOn)return;window.__richImportOn=true;window.__oldImport=window.importPersonalClassesFile;window.importPersonalClassesFile=function(){if(rich())return;if(window.__oldImport)return window.__oldImport.apply(this,arguments);};try{importPersonalClassesFile=window.importPersonalClassesFile;}catch(e){}document.addEventListener('click',function(ev){var t=(ev.target&&ev.target.textContent)||'';if(/استيراد وحفظ|استيراد/.test(t)){if(rich()){ev.preventDefault();ev.stopPropagation();}}},true);}
install();setTimeout(install,500);setTimeout(install,1500);
})();
<\/script>`;}
    function patchHtmlSource(html){
      if(!html.includes(STAMP)){html=html.replace(/<head[^>]*>/i,function(m){return m+injectedGuard();});}
      html=html.replace(/<option\s+value="9">\s*8\s*أساسي\s*9\s*<\/option>\s*<option\s+value="8">\s*8\s*أساسي\s*8\s*<\/option>\s*<option\s+value="7">\s*8\s*أساسي\s*7\s*<\/option>\s*<option\s+value="6">\s*8\s*أساسي\s*6\s*<\/option>/gi,'');
      html=html.replace('const ORIGINAL_DEFAULT_CLASSES = JSON.parse(JSON.stringify(data));','const ORIGINAL_DEFAULT_CLASSES = {};\nObject.keys(data).forEach(k => delete data[k]);');
      html=html.replace('setTimeout(autoRestoreWhenEmpty, 1400);','// Auto restore disabled\n    // setTimeout(autoRestoreWhenEmpty, 1400);');
      return html;
    }
    async function fetchLatestZipPath(){const api='https://api.github.com/repos/princejour/sira-v2/git/trees/main?recursive=1';const res=await fetch(api);if(!res.ok)throw new Error('تعذر الاتصال بمستودع sira-v2');const json=await res.json();const zips=(json.tree||[]).filter(x=>/\.zip$/i.test(x.path)&&!/extracted|build|gradle/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));if(!zips.length)throw new Error('لا يوجد ملف ZIP في مستودع sira-v2');return zips[zips.length-1].path;}
    async function run(){try{const zipPath=await fetchLatestZipPath();const zipUrl='https://raw.githubusercontent.com/princejour/sira-v2/main/'+zipPath.split('/').map(encodeURIComponent).join('/');const zipBytes=await(await fetch(zipUrl)).arrayBuffer();const zip=await JSZip.loadAsync(zipBytes);const indexPath=Object.keys(zip.files).find(p=>/app\/src\/main\/assets\/index\.html$/i.test(p))||Object.keys(zip.files).find(p=>/(^|\/)index\.html$/i.test(p));if(!indexPath)throw new Error('لم يتم العثور على index.html داخل ZIP');let html=await zip.files[indexPath].async('string');html=patchHtmlSource(html);const frame=document.createElement('iframe');document.body.innerHTML='';document.body.appendChild(frame);frame.srcdoc=html;}catch(e){document.getElementById('m').innerHTML='خطأ في فتح نسخة Firebase:<br>'+String(e.message||e);}}
    run();
  </script>
</body>
</html>
